<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Booking — Hair by Maeva</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="figma-overrides.css"></head><body><main class="section booking-access"><p class="eyebrow">HAIR BY MAEVA</p><div id="booking-state"><p class="eyebrow">LOADING</p><h1>Looking up<br><em>your booking.</em></h1></div></main><script>const root=document.querySelector('#booking-state');const token=new URLSearchParams(location.search).get('token');if(!token){root.innerHTML='<p class="eyebrow">BOOKING LINK</p><h1>This link<br><em>is incomplete.</em></h1><p>Please use the secure link from your email.</p>'}else{fetch('/api/booking-access?token='+encodeURIComponent(token)).then(r=>r.json().then(data=>({ok:r.ok,data}))).then(({ok,data})=>{if(!ok)throw Error(data.error);root.innerHTML='<p class="eyebrow">MY BOOKING</p><h1>'+data.status.replaceAll('_',' ')+' <em>✓</em></h1><div class="review-card"><p>'+data.service_name_snapshot+'</p><p>'+data.length_name_snapshot+'</p><p>'+data.appointment_date+' · '+data.appointment_time+'</p><p class="review-line"><span>Total</span><strong>$'+Number(data.total_price).toFixed(2)+'</strong></p><p class="review-line"><span>Deposit paid</span><strong>$'+Number(data.reservation_fee).toFixed(2)+'</strong></p><p class="review-note">Payment status: '+data.payment_status.replaceAll('_',' ')+'.</p></div>'}).catch(error=>{root.innerHTML='<p class="eyebrow">BOOKING LINK</p><h1>We couldn’t<br><em>find that booking.</em></h1><p>'+error.message+'</p>'})}</script></body></html>
