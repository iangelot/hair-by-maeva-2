<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Booking — Hair by Maeva</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="figma-overrides.css"></head>
<body><main class="section booking-access"><p class="eyebrow">HAIR BY MAEVA</p><div id="booking-state" aria-live="polite" aria-atomic="true"><p class="eyebrow">LOADING</p><h1>Looking up<br><em>your booking.</em></h1></div></main>
<script>
const root = document.querySelector('#booking-state'); const token = new URLSearchParams(location.search).get('token');
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function renderBooking(data) {
  const statusLabel = String(data.status || '').replaceAll('_', ' '); const statusMark = data.status === 'confirmed' ? ' <em>✓</em>' : '';
  root.innerHTML = `<p class="eyebrow">MY BOOKING</p><h1>${esc(statusLabel)}${statusMark}</h1><p class="provider-line"><strong>Hair by Maeva</strong><br>Chicago, IL</p><div class="review-card"><p>${esc(data.service_name_snapshot)}</p><p>${esc(data.length_name_snapshot)}</p><p>${esc(data.appointment_date)} · ${esc(data.appointment_time)}</p><p class="review-line"><span>Total</span><strong>$${Number(data.total_price).toFixed(2)}</strong></p><p class="review-line"><span>Deposit</span><strong>$${Number(data.reservation_fee).toFixed(2)}</strong></p><p class="review-line"><span>Remaining</span><strong>$${Number(data.remaining_balance).toFixed(2)}</strong></p><p class="review-note">Payment status: ${esc(data.payment_status.replaceAll('_',' '))}.</p></div><div class="manage-actions"><a class="pill" href="mailto:maevausa@outlook.com?subject=Booking%20${encodeURIComponent(data.booking_number || '')}">CONTACT MAEVA</a><button class="pill pill-dark" id="reschedule">REQUEST RESCHEDULE</button><button class="pill" id="cancel">CANCEL BOOKING</button></div><form id="reschedule-form" class="hidden manage-form"><label>NEW DATE<input required type="date" name="date" min="${new Date().toISOString().slice(0,10)}"></label><label>NEW TIME<input required type="time" name="time"></label><button class="pill pill-dark" type="submit">SAVE NEW TIME ↗</button><p class="form-status" id="manage-status"></p></form>`;
  if (['cancelled', 'completed'].includes(data.status)) { document.querySelector('.manage-actions')?.remove(); document.querySelector('#reschedule-form')?.remove(); }
  if (Array.isArray(data.options_snapshot) && data.options_snapshot.length) { const options = document.createElement('p'); options.textContent = data.options_snapshot.map((item) => item.name).join(', '); document.querySelector('.review-card').insertBefore(options, document.querySelector('.review-card .review-line')); }
  document.querySelector('#reschedule').addEventListener('click', () => document.querySelector('#reschedule-form').classList.toggle('hidden'));
  document.querySelector('#cancel').addEventListener('click', async () => { if (!confirm('Cancel this booking?')) return; await updateBooking({ action: 'cancel' }); });
  document.querySelector('#reschedule-form').addEventListener('submit', async (event) => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.currentTarget)); await updateBooking({ action: 'reschedule', ...values }); });
}
async function updateBooking(payload) { const status = document.querySelector('#manage-status') || root; try { status.textContent = 'Saving…'; const response = await fetch('/api/booking-action', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ token, ...payload }) }); const data = await response.json(); if (!response.ok) throw Error(data.error); status.textContent = payload.action === 'cancel' ? 'Booking cancelled.' : 'Reschedule requested.'; if (payload.action === 'cancel') document.querySelectorAll('.manage-actions,.manage-form').forEach((item) => item.remove()); } catch (error) { status.textContent = error.message; } }
if (!token) root.innerHTML='<p class="eyebrow">BOOKING LINK</p><h1>This link<br><em>is incomplete.</em></h1><p>Please use the secure link from your email.</p>';
else fetch('/api/booking-access?token='+encodeURIComponent(token)).then((response) => response.json().then((data) => ({ ok: response.ok, data }))).then(({ ok, data }) => { if (!ok) throw Error(data.error); renderBooking(data); }).catch((error) => { root.innerHTML='<p class="eyebrow">BOOKING LINK</p><h1>We couldn’t<br><em>find that booking.</em></h1><p>'+esc(error.message)+'</p>'; });
</script></body></html>
